<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS Workspace - 登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>&#128202; PS Workspace</h1>
      <p class="subtitle">PS Team 统一工作平台</p>

      <div class="login-error" id="login-error"></div>

      <form id="login-form" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名 (域账号 或 本地 Windows 账号)</label>
          <input type="text" class="form-input" id="username" placeholder="your.name" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">
          <span id="login-btn-text">登录</span>
          <span id="login-spinner" style="display:none"><span class="spinner"></span></span>
        </button>
      </form>
    </div>
  </div>

  <script>
    function doLogin(e) {
      e.preventDefault();
      var btn = document.getElementById("login-btn");
      var btnText = document.getElementById("login-btn-text");
      var spinner = document.getElementById("login-spinner");
      var errorEl = document.getElementById("login-error");

      btn.disabled = true;
      btnText.style.display = "none";
      spinner.style.display = "inline";
      errorEl.style.display = "none";

      fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        })
      })
      .then(function(r) { return r.json().then(function(data) { return {ok: r.ok, data: data}; }); })
      .then(function(result) {
        if (result.ok && result.data.token) {
          localStorage.setItem("psws_token", result.data.token);
          localStorage.setItem("psws_user", result.data.user);
          window.location.href = "/";
        } else {
          errorEl.textContent = result.data.message || "登录失败，请检查账号密码";
          errorEl.style.display = "block";
        }
      })
      .catch(function(err) {
        errorEl.textContent = "网络错误: " + err.message;
        errorEl.style.display = "block";
      })
      .finally(function() {
        btn.disabled = false;
        btnText.style.display = "inline";
        spinner.style.display = "none";
      });

      return false;
    }
  </script>
</body>
</html>
